name: Bug report
description: Report a reproducible problem in data, docs, or an example
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the file, example path, browser, and steps when relevant.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Supporting source
      description: Link a specification or vendor source for data corrections.
