<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Create a metadata-reduced copy</title><style>body{max-width:820px;margin:40px auto;padding:0 18px;font:16px/1.6 system-ui;color:#17211b}h1{font-size:clamp(30px,6vw,52px)}.card{padding:22px;border:1px solid #d8ddd9;border-radius:16px}label{display:grid;gap:7px;margin:12px 0;font-weight:700}button,input,select{font:inherit;padding:10px}button{background:#0000ff;color:#fff;border:0;border-radius:9px;font-weight:700}button:disabled{opacity:.5}img,video,canvas{max-width:100%;margin-top:16px}.status{white-space:pre-wrap;background:#f2f4f2;padding:14px;border-radius:10px}small{color:#59635d}</style></head><body><h1>Create a metadata-reduced copy</h1><div class="card"><p>Canvas re-encoding normally omits application metadata such as EXIF. Keep the original and verify the exported image.</p><label>Select a JPEG, PNG, or WebP<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="process" disabled>Create JPEG copy</button><p id="status" class="status">Choose an image.</p></div><p><small>Runs locally in this page. Complete tools: <a href="https://harnesstrail.com/en/">HarnessTrail</a>.</small></p><script>let source;file.onchange=()=>{source=file.files[0];process.disabled=!source};process.onclick=async()=>{try{const bitmap=await createImageBitmap(source,{imageOrientation:'from-image'}),canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0);canvas.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=source.name.replace(/\.[^.]+$/,'')+'-metadata-reduced.jpg';a.click();status.textContent='Copy created. Inspect orientation and color before discarding the original.'},'image/jpeg',.92)}catch(error){status.textContent=`Failed: ${error.message}`}}</script></body></html>
