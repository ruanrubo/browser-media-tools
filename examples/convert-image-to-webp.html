<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Convert an image to WebP</title><style>body{max-width:820px;margin:40px auto;padding:0 18px;font:16px/1.6 system-ui;color:#17211b}h1{font-size:clamp(30px,6vw,52px)}.card{padding:22px;border:1px solid #d8ddd9;border-radius:16px}label{display:grid;gap:7px;margin:12px 0;font-weight:700}button,input,select{font:inherit;padding:10px}button{background:#0000ff;color:#fff;border:0;border-radius:9px;font-weight:700}button:disabled{opacity:.5}img,video,canvas{max-width:100%;margin-top:16px}.status{white-space:pre-wrap;background:#f2f4f2;padding:14px;border-radius:10px}small{color:#59635d}</style></head><body><h1>Convert an image to WebP</h1><div class="card"><label>Select an image<input id="file" type="file" accept="image/*"></label><label>Quality <input id="quality" type="range" min="10" max="100" value="82"></label><button id="convert" disabled>Convert and download</button><p id="status" class="status">Choose an image.</p><img id="preview" alt="Converted preview"></div><p><small>Runs locally in this page. Complete tools: <a href="https://harnesstrail.com/en/">HarnessTrail</a>.</small></p><script>let source;file.onchange=async()=>{source=file.files[0];convert.disabled=!source;status.textContent=source?`${source.name} · ${source.size.toLocaleString()} bytes`:'Choose an image.'};convert.onclick=async()=>{try{const bitmap=await createImageBitmap(source),canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;canvas.getContext('2d').drawImage(bitmap,0,0);canvas.toBlob(blob=>{if(!blob||blob.type!=='image/webp'){status.textContent='This browser did not provide WebP encoding.';return}const url=URL.createObjectURL(blob);preview.src=url;const a=document.createElement('a');a.href=url;a.download=source.name.replace(/\.[^.]+$/,'')+'.webp';a.click();status.textContent=`Output: ${blob.size.toLocaleString()} bytes`},'image/webp',quality.value/100)}catch(error){status.textContent=`Could not decode the selected image: ${error.message}`}}</script></body></html>
