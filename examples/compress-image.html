<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Resize and compress an image</title><style>body{max-width:820px;margin:40px auto;padding:0 18px;font:16px/1.6 system-ui;color:#17211b}h1{font-size:clamp(30px,6vw,52px)}.card{padding:22px;border:1px solid #d8ddd9;border-radius:16px}label{display:grid;gap:7px;margin:12px 0;font-weight:700}button,input,select{font:inherit;padding:10px}button{background:#0000ff;color:#fff;border:0;border-radius:9px;font-weight:700}button:disabled{opacity:.5}img,video,canvas{max-width:100%;margin-top:16px}.status{white-space:pre-wrap;background:#f2f4f2;padding:14px;border-radius:10px}small{color:#59635d}</style></head><body><h1>Resize and compress an image</h1><div class="card"><label>Select an image<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Maximum width<input id="width" type="number" min="64" value="1600"></label><label>JPEG quality<input id="quality" type="range" min="20" max="100" value="82"></label><button id="process" disabled>Process and download</button><p id="status" class="status">Choose an image.</p></div><p><small>Runs locally in this page. Complete tools: <a href="https://harnesstrail.com/en/">HarnessTrail</a>.</small></p><script>let source;file.onchange=()=>{source=file.files[0];process.disabled=!source};process.onclick=async()=>{try{const bitmap=await createImageBitmap(source),scale=Math.min(1,Number(width.value)/bitmap.width),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{if(!blob)return status.textContent='Encoding failed.';const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=source.name.replace(/\.[^.]+$/,'')+'-optimized.jpg';a.click();status.textContent=`${bitmap.width}×${bitmap.height} → ${canvas.width}×${canvas.height}\n${source.size.toLocaleString()} → ${blob.size.toLocaleString()} bytes`},'image/jpeg',quality.value/100)}catch(error){status.textContent=`Failed: ${error.message}`}}</script></body></html>
