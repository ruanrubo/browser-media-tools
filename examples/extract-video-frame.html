<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Extract a frame from a video</title><style>body{max-width:820px;margin:40px auto;padding:0 18px;font:16px/1.6 system-ui;color:#17211b}h1{font-size:clamp(30px,6vw,52px)}.card{padding:22px;border:1px solid #d8ddd9;border-radius:16px}label{display:grid;gap:7px;margin:12px 0;font-weight:700}button,input,select{font:inherit;padding:10px}button{background:#0000ff;color:#fff;border:0;border-radius:9px;font-weight:700}button:disabled{opacity:.5}img,video,canvas{max-width:100%;margin-top:16px}.status{white-space:pre-wrap;background:#f2f4f2;padding:14px;border-radius:10px}small{color:#59635d}</style></head><body><h1>Extract a frame from a video</h1><div class="card"><label>Select a browser-playable video<input id="file" type="file" accept="video/*"></label><video id="video" controls></video><label>Time in seconds<input id="time" type="number" min="0" step="0.1" value="0"></label><button id="capture" disabled>Capture PNG</button><p id="status" class="status">Choose a video.</p><canvas id="canvas" hidden></canvas></div><p><small>Runs locally in this page. Complete tools: <a href="https://harnesstrail.com/en/">HarnessTrail</a>.</small></p><script>file.onchange=()=>{const selected=file.files[0];if(!selected)return;video.src=URL.createObjectURL(selected);video.onloadedmetadata=()=>{time.max=video.duration;capture.disabled=false;status.textContent=`Duration: ${video.duration.toFixed(2)} seconds`}};capture.onclick=()=>{video.currentTime=Math.min(Number(time.value)||0,video.duration);video.onseeked=()=>{canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.hidden=false;canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`frame-${video.currentTime.toFixed(2)}.png`;a.click()},'image/png')}}</script></body></html>
