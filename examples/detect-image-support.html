<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Detect browser image encoding support</title><style>body{max-width:820px;margin:40px auto;padding:0 18px;font:16px/1.6 system-ui;color:#17211b}h1{font-size:clamp(30px,6vw,52px)}.card{padding:22px;border:1px solid #d8ddd9;border-radius:16px}label{display:grid;gap:7px;margin:12px 0;font-weight:700}button,input,select{font:inherit;padding:10px}button{background:#0000ff;color:#fff;border:0;border-radius:9px;font-weight:700}button:disabled{opacity:.5}img,video,canvas{max-width:100%;margin-top:16px}.status{white-space:pre-wrap;background:#f2f4f2;padding:14px;border-radius:10px}small{color:#59635d}</style></head><body><h1>Detect browser image encoding support</h1><div class="card"><p>This test asks the current browser to encode a canvas and verifies the returned MIME type.</p><button id="run">Run tests</button><pre id="status" class="status">Not tested</pre></div><p><small>Runs locally in this page. Complete tools: <a href="https://harnesstrail.com/en/">HarnessTrail</a>.</small></p><script>run.onclick=async()=>{const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;const ctx=canvas.getContext('2d');ctx.fillStyle='#0000ff';ctx.fillRect(0,0,2,2);const test=type=>new Promise(resolve=>canvas.toBlob(blob=>resolve(Boolean(blob&&blob.type===type)),type,.8));const types=['image/jpeg','image/png','image/webp','image/avif'];const rows=[];for(const type of types)rows.push(`${type}: ${await test(type)?'encode supported':'not confirmed'}`);status.textContent=rows.join('\n')}</script></body></html>
